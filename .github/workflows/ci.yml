name: Haldoz checks
on:
  pull_request:
  push:
    branches: ["main", "codex/**", "recovery/**", "feature/**"]
permissions:
  contents: read
concurrency:
  group: haldoz-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      HALDOZ_AUTH_READY: "false"
      HALDOZ_PAGES_READY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:cloudflare
      - name: Production HTTP boundaries
        run: |
          npm run start > /tmp/haldoz-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3100/ > /dev/null; then break; fi
            sleep 1
          done
          npm run verify:http
          node scripts/verify-owner-routes.mjs
          node scripts/verify-account-workflow.mjs
          node scripts/verify-draft-routes.mjs
